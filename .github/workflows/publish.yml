name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Create release zip
        run: zip -r logseq-pele.zip dist/ package.json icon.png README.md LICENSE

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: logseq-pele.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
